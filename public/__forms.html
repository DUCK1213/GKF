<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Netlify Form Detection</title>
</head>
<body>
  <!-- Netlify Deploy-Time Form Detection -->
  <!-- Because Next.js renders forms dynamically via React, this static HTML allows Netlify to parse and register the forms automatically during build time. -->

  <!-- 1. Mentor Application Form -->
  <form name="mentor-application" netlify data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="mentor-application" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="profession" />
    <select name="availability">
      <option value="one-sunday">One Sunday only</option>
      <option value="monthly">Monthly</option>
      <option value="full-term">Full term</option>
    </select>
    <textarea name="motivation"></textarea>
  </form>

  <!-- 2. School / Organization Partnership Form -->
  <form name="partner-inquiry" netlify data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="partner-inquiry" />
    <input type="text" name="bot-field" />
    <input type="text" name="orgName" />
    <input type="text" name="contactName" />
    <input type="email" name="contactEmail" />
    <select name="partnerType">
      <option value="school-hub">Host a school hub</option>
      <option value="cohort-sponsor">Sponsor a student cohort</option>
      <option value="ngo">NGO collaboration</option>
      <option value="corporate">Corporate CSR partnership</option>
    </select>
    <textarea name="details"></textarea>
  </form>

  <!-- 3. General Message Form -->
  <form name="general-message" netlify data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="general-message" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
  </form>

  <!-- 4. Default Contact Form (Standard Netlify Example) -->
  <form name="contact" netlify data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
